[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchflow-agent"
version = "0.1.0"
description = "A tool-using AI agent for offline technical research."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Weldei" }]
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
researchflow = "researchflow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/researchflow"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
